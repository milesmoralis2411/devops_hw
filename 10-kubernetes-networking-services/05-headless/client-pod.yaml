apiVersion: v1
kind: Pod
metadata:
  name: headless-dns-client
  labels:
    app: headless-dns-client
    lab: kubernetes-services
spec:
  containers:
    - name: dns-client
      image: curlimages/curl:8.5.0
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
