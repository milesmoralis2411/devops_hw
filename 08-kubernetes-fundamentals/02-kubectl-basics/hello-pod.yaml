apiVersion: v1
kind: Pod
metadata:
  name: hello-kubectl
  labels:
    app: hello-kubectl
    lab: kubernetes-fundamentals
spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
          name: http
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
