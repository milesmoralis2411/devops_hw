# Session 17 - Complete CI/CD + DevSecOps pipeline
#
#   Code -> Build -> Unit Test -> SAST -> SCA -> Secret Scan
#        -> Docker Build -> Image Scan -> Security Gate -> Push -> Deploy
#
name: DevSecOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - '15-cicd-github-actions/app/**'
      - '16-cicd-devsecops/**'
      - '.github/workflows/devsecops.yml'
  pull_request:
  workflow_dispatch:

env:
  APP_DIR: 15-cicd-github-actions/app
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/yatri-secure

permissions:
  contents: read
  packages: write
  security-events: write     # required to upload SARIF to the Security tab
  actions: read

jobs:
  # ================================================================ 1. BUILD
  build:
    name: 1 - Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund
      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}
        run: npm test

  # ================================================================ 2. SAST
  sast:
    name: 2 - SAST (CodeQL + Semgrep)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      # --- CodeQL: the static analyser built into GitHub ---
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript

      # --- Semgrep: rule-based SAST, results into the Security tab ---
      - name: Semgrep scan
        run: |
          pip install semgrep
          semgrep scan \
            --config=p/javascript \
            --config=p/security-audit \
            --sarif --output=semgrep.sarif \
            --metrics=off || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ================================================================ 3. SCA
  sca:
    name: 3 - SCA (dependency vulnerabilities)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm audit
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm audit --audit-level=high --json > npm-audit.json || true
          npm audit --audit-level=high || echo "::warning::npm audit found issues"

      - name: Trivy filesystem scan (dependencies + config)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ env.APP_DIR }}
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Generate an SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ env.APP_DIR }}
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json

  # ======================================================== 4. SECRET SCAN
  secret-scan:
    name: 4 - Secret scanning
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # Gitleaks needs full history to scan commits

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: 16-cicd-devsecops/security/gitleaks.toml
        continue-on-error: true

      - name: TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
        continue-on-error: true

  # ====================================================== 5. IMAGE + SCAN
  image-scan:
    name: 5 - Docker build and image scan
    runs-on: ubuntu-latest
    needs: [sast, sca, secret-scan]
    outputs:
      critical: ${{ steps.gate-count.outputs.critical }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed yet - it must pass the gate first)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: false
          load: true
          tags: yatri-secure:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (SARIF for the Security tab)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: yatri-secure:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy image scan (JSON, for counting)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: yatri-secure:${{ github.sha }}
          format: json
          output: trivy-image.json
          severity: CRITICAL,HIGH

      - name: Count CRITICAL findings
        id: gate-count
        run: |
          CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-image.json)
          echo "critical=$CRIT" >> "$GITHUB_OUTPUT"
          echo "CRITICAL vulnerabilities: $CRIT"

      - name: Save image for later jobs
        run: docker save yatri-secure:${{ github.sha }} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: scanned-image
          path: image.tar.gz
          retention-days: 1

  # ========================================================= 6. SECURITY GATE
  security-gate:
    name: 6 - Security gate
    runs-on: ubuntu-latest
    needs: image-scan
    steps:
      - name: Enforce the policy
        run: |
          CRIT="${{ needs.image-scan.outputs.critical }}"
          echo "Policy: block the release on any CRITICAL vulnerability."
          echo "Found: ${CRIT:-0}"
          if [ "${CRIT:-0}" -gt 0 ]; then
            echo "::error::Security gate FAILED - ${CRIT} CRITICAL vulnerabilities"
            echo "### Security gate: FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "Security gate PASSED"
          echo "### Security gate: PASSED" >> $GITHUB_STEP_SUMMARY

  # ============================================================== 7. PUSH
  push:
    name: 7 - Push image
    runs-on: ubuntu-latest
    needs: security-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: scanned-image

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load, tag and push the SAME image that was scanned
        run: |
          gunzip -c image.tar.gz | docker load
          docker tag yatri-secure:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag yatri-secure:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ============================================================ 8. DEPLOY
  deploy:
    name: 8 - Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: push
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4

      - name: Render manifests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          sed -i "s|image: .*yatri-secure.*|image: ${IMAGE}|" \
            16-cicd-devsecops/kubernetes/deployment.yaml
          cat 16-cicd-devsecops/kubernetes/deployment.yaml

      # With a real cluster, replace this with:
      #   echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
      #   kubectl apply -f 16-cicd-devsecops/kubernetes/
      #   kubectl rollout status deploy/yatri-secure --timeout=120s
      - name: Validate manifests
        run: kubectl apply --dry-run=client -f 16-cicd-devsecops/kubernetes/ || true
