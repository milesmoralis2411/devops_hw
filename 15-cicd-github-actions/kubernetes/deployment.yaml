apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-cicd-demo
  labels: { app: yatri-cicd-demo }
spec:
  replicas: 2
  selector:
    matchLabels: { app: yatri-cicd-demo }
  template:
    metadata:
      labels: { app: yatri-cicd-demo }
    spec:
      containers:
        - name: app
          # The CD workflow rewrites this line with the freshly pushed digest.
          image: yatri-cicd-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: GREETING
              value: "Hello World from the CI/CD pipeline"
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 192Mi }
