# FIXED: the Ingress backend now names the Service that actually exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: ts-web }
  template:
    metadata:
      labels: { app: ts-web }
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  selector: { app: ts-web }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ts-ingress-fixed
spec:
  ingressClassName: nginx
  rules:
    - host: ts-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 80
