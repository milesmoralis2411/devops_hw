# BROKEN: the Ingress backend points at a Service name that does not exist
# ("web-svc" vs the real "web-service"). The Ingress is accepted by the API
# server - names are not validated - but requests return 503/404 from the
# controller because it has no endpoints to forward to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: ts-web }
  template:
    metadata:
      labels: { app: ts-web }
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  selector: { app: ts-web }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ts-ingress-404
spec:
  ingressClassName: nginx
  rules:
    - host: ts-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-svc       # <-- wrong, the Service is "web-service"
                port:
                  number: 80
