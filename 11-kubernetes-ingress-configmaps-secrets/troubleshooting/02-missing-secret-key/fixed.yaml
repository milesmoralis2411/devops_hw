# FIXED: secretKeyRef now points at the key that actually exists (db_password).
# The Pod reaches Running and both env vars resolve.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  db_user: appuser
  db_password: s3cret-demo-only      # note: key is db_password
---
apiVersion: v1
kind: Pod
metadata:
  name: ts-missing-secret-key-fixed
  labels: { demo: troubleshooting, case: "02" }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo user=$DB_USER; sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: db_user
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: db_password
