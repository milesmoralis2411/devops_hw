# BROKEN: the Secret exists but the requested KEY does not.
# Expected symptom: CreateContainerConfigError, "couldn't find key db_pass"
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  db_user: appuser
  db_password: s3cret-demo-only      # note: key is db_password
---
apiVersion: v1
kind: Pod
metadata:
  name: ts-missing-secret-key
  labels: { demo: troubleshooting, case: "02" }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo user=$DB_USER; sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: db_user
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: db_pass           # <-- typo, the real key is db_password
