apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "yatri-app.fullname" . }}-test-connection"
  labels:
    {{- include "yatri-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36       # pinned: an untagged image means :latest and a pull on every run
      command: ['wget']
      args: ['{{ include "yatri-app.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
