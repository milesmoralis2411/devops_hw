# SYMPTOM: the Service resolves, but every connection is refused / times out.
#          "kubectl get endpointslices" shows NO endpoints.
# CAUSE: the Service selector (app=web) does not match the Pod labels
#        (app=web-app). Selectors are exact matches - no fuzzy matching.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: web-app }
  template:
    metadata:
      labels: { app: web-app }        # <-- Pods are labelled app=web-app
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: svc-demo
spec:
  selector:
    app: web                          # <-- but the Service looks for app=web
  ports:
    - port: 80
      targetPort: 80
