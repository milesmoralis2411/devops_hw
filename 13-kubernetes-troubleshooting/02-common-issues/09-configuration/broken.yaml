# SYMPTOM: STATUS=CreateContainerConfigError
# CAUSE: three separate configuration mistakes in one manifest -
#   1. configMapKeyRef names a key that does not exist
#   2. the ConfigMap volume references a missing ConfigMap
#   3. the container command points at a binary that is not in the image
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
data:
  log_level: debug
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/usr/local/bin/myapp"]        # 3. not present in busybox
      env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: logLevel                    # 1. real key is log_level
      volumeMounts:
        - name: extra
          mountPath: /etc/extra
  volumes:
    - name: extra
      configMap:
        name: extra-settings                   # 2. does not exist
