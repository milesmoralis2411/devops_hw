# SYMPTOM: STATUS=CrashLoopBackOff, RESTARTS climbing
# CAUSE: the container command exits 1 immediately; restartPolicy Always
#        retries with exponential backoff (10s, 20s, 40s ... max 5m).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: crashloop-demo }
  template:
    metadata:
      labels: { app: crashloop-demo }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo 'starting up'; echo 'FATAL: config file /etc/app/config.yaml not found' >&2; exit 1"]
