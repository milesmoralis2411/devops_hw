# SYMPTOM: the Pod is Running and Ready, the Service has an endpoint, DNS
#          resolves - yet every connection from another Pod is refused.
# CAUSE: the server binds to 127.0.0.1 (loopback) instead of 0.0.0.0.
#        Loopback is only reachable from inside the Pod's own network
#        namespace, so traffic arriving on the Pod IP finds nothing listening.
#        (The readiness probe is exec-based and runs INSIDE the Pod, so it
#        passes - which is exactly what makes this bug confusing.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: loopback-conf
data:
  default.conf: |
    server {
      listen 127.0.0.1:80;          # <-- loopback only
      location / { return 200 "hello from $hostname\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loopback-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: loopback-web }
  template:
    metadata:
      labels: { app: loopback-web }
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports: [{ containerPort: 80 }]
          readinessProbe:
            exec:
              command: ["wget", "-qO-", "http://127.0.0.1/"]
            periodSeconds: 5
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: loopback-conf
---
apiVersion: v1
kind: Service
metadata:
  name: loopback-web
spec:
  selector: { app: loopback-web }
  ports: [{ port: 80, targetPort: 80 }]
