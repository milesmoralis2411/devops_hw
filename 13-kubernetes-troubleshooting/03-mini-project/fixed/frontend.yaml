apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-frontend-conf
data:
  default.conf: |
    server {
      listen 80;
      location = / { default_type text/html; return 200 "<h1>Yatri Shop</h1>\n"; }
      location /api/ {
        proxy_pass http://api-svc:8080;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-frontend
  labels: { app: shop-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: shop-frontend }
  template:
    metadata:
      labels: { app: shop-frontend }
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: conf
          configMap:
            name: shop-frontend-conf
---
apiVersion: v1
kind: Service
metadata:
  name: shop-frontend
spec:
  type: NodePort
  selector:
    app: shop-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
