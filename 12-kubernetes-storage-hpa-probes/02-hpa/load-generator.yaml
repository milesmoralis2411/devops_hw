# Load generator: an infinite curl loop against the php-apache Service.
# Run several replicas to push CPU high enough to trigger scale-out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "while true; do wget -q -O- http://php-apache.default.svc.cluster.local > /dev/null; done"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 200m, memory: 64Mi }
