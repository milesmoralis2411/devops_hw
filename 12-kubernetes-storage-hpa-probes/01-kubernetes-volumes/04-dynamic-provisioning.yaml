# Dynamic provisioning: no PV is written by hand. The PVC names the cluster
# default StorageClass (minikube ships "standard") and the provisioner
# creates a matching PV automatically.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-dynamic
  labels: { demo: volumes, type: dynamic }
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  storageClassName: standard
---
apiVersion: v1
kind: Pod
metadata:
  name: dynamic-consumer
  labels: { demo: volumes, type: dynamic }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo 'dynamically provisioned' > /data/hello.txt; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: pvc-dynamic
