# emptyDir: scratch space shared between two containers in the same Pod.
# Deleted permanently when the Pod is removed.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  labels: { demo: volumes, type: emptydir }
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["/bin/sh", "-c", "while true; do date >> /cache/out.log; sleep 5; done"]
      volumeMounts:
        - name: cache
          mountPath: /cache
    - name: reader
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: cache
          mountPath: /cache
  volumes:
    - name: cache
      emptyDir: {}
