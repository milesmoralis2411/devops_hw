# Prometheus, deployed with plain manifests so every moving part is visible.
# (In production you would use the kube-prometheus-stack Helm chart.)
#
# Scrape jobs:
#   prometheus          - itself
#   kubernetes-pods     - any Pod annotated prometheus.io/scrape: "true"
#   kubernetes-cadvisor - per-container CPU and memory, from every kubelet
#   kube-state-metrics  - object state: replicas, restarts, readiness

apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.monitoring.svc:9093"]

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc:8080"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: application
        rules:
          - alert: AppDown
            expr: up{job="kubernetes-pods", app="metrics-app"} == 0
            for: 1m
            labels: { severity: critical }
            annotations:
              summary: "metrics-app Pod {{ $labels.pod }} is not being scraped"

          - alert: HighErrorRate
            expr: |
              sum(rate(http_requests_total{app="metrics-app", status=~"5.."}[1m]))
                /
              sum(rate(http_requests_total{app="metrics-app"}[1m])) > 0.05
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "More than 5% of metrics-app requests are failing"
              description: "Error ratio is {{ $value | humanizePercentage }}"

          - alert: HighLatencyP95
            expr: |
              histogram_quantile(0.95,
                sum by (le) (rate(http_request_duration_seconds_bucket{app="metrics-app"}[2m]))
              ) > 0.5
            for: 2m
            labels: { severity: warning }
            annotations:
              summary: "metrics-app p95 latency above 500ms"

          - alert: AppNotReady
            expr: app_ready{app="metrics-app"} == 0
            for: 30s
            labels: { severity: warning }
            annotations:
              summary: "Pod {{ $labels.pod }} reports itself not ready"

      - name: kubernetes
        rules:
          - alert: HighContainerCPU
            expr: |
              sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!="", namespace="monitoring"}[2m]))
                /
              sum by (namespace, pod) (kube_pod_container_resource_limits{resource="cpu", namespace="monitoring"}) > 0.8
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.pod }} is using over 80% of its CPU limit"

          - alert: HighContainerMemory
            expr: |
              sum by (namespace, pod) (container_memory_working_set_bytes{container!="", namespace="monitoring"})
                /
              sum by (namespace, pod) (kube_pod_container_resource_limits{resource="memory", namespace="monitoring"}) > 0.9
            for: 2m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.pod }} is using over 90% of its memory limit"

          - alert: PodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total[10m]) > 3
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in 10m"

          - alert: DeploymentReplicasUnavailable
            expr: kube_deployment_status_replicas_unavailable > 0
            for: 2m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app: prometheus }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /-/healthy, port: web }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
    - name: web
      port: 9090
      targetPort: web
      nodePort: 30090
