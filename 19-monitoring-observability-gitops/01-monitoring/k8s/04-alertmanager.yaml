# Alertmanager receives firing alerts from Prometheus, groups and de-duplicates
# them, and routes them to receivers. A real setup would route to Slack,
# PagerDuty or email; this demo routes to a webhook that logs the payload, so
# the delivery can be seen with "kubectl logs".
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    route:
      receiver: webhook-logger
      group_by: [alertname, severity]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      routes:
        - matchers: [severity="critical"]
          receiver: webhook-logger
          repeat_interval: 15m

    receivers:
      - name: webhook-logger
        webhook_configs:
          - url: http://alert-webhook.monitoring.svc:8080/
            send_resolved: true

    # A real receiver would look like:
    #  - name: slack
    #    slack_configs:
    #      - api_url_file: /etc/alertmanager/secrets/slack-webhook
    #        channel: "#alerts"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels: { app: alertmanager }
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: web
              containerPort: 9093
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  type: NodePort
  selector: { app: alertmanager }
  ports:
    - name: web
      port: 9093
      targetPort: web
      nodePort: 30093
---
# Tiny webhook receiver: prints every alert notification it gets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  namespace: monitoring
  labels: { app: alert-webhook }
spec:
  replicas: 1
  selector:
    matchLabels: { app: alert-webhook }
  template:
    metadata:
      labels: { app: alert-webhook }
    spec:
      containers:
        - name: logger
          image: metrics-app:1.0.0      # reuses the node image already loaded
          command: ["node", "-e"]
          args:
            - |
              require('http').createServer((req, res) => {
                let body = '';
                req.on('data', c => body += c);
                req.on('end', () => {
                  try {
                    const p = JSON.parse(body);
                    for (const a of p.alerts) {
                      console.log(`[${p.status.toUpperCase()}] ${a.labels.alertname} severity=${a.labels.severity} pod=${a.labels.pod || '-'} :: ${a.annotations.summary}`);
                    }
                  } catch (e) { console.log(body); }
                  res.end('ok');
                });
              }).listen(8080, () => console.log('alert webhook listening on 8080'));
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook
  namespace: monitoring
spec:
  selector: { app: alert-webhook }
  ports:
    - port: 8080
      targetPort: 8080
