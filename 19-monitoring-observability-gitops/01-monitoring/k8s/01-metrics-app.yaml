# The instrumented application. The prometheus.io/* annotations are how the
# Prometheus "kubernetes-pods" job below discovers what to scrape.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-app
  namespace: monitoring
  labels: { app: metrics-app }
spec:
  replicas: 2
  selector:
    matchLabels: { app: metrics-app }
  template:
    metadata:
      labels: { app: metrics-app }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: metrics-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1.0.0"
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 500m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-app
  namespace: monitoring
  labels: { app: metrics-app }
spec:
  selector: { app: metrics-app }
  ports:
    - name: http
      port: 80
      targetPort: http
