apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yatri-trips
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"        # after monitoring (wave 0)
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/yatri/platform.git
    targetRevision: main
    path: helm/yatri-trips
    helm:
      releaseName: yatri-trips
      valueFiles:
        - values.yaml
        - values-prod.yaml                   # CI writes image.tag here
  destination:
    server: https://kubernetes.default.svc
    namespace: yatri                         # created by Terraform with PSA "restricted"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 2m }
  # The HPA owns .spec.replicas; without this Argo CD would fight it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
