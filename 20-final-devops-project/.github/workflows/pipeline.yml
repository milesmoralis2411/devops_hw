# Yatri Trips - CI/CD + DevSecOps + GitOps pipeline
#
#  test -> sast -> sca -> secret-scan -> build+image-scan -> security-gate
#       -> push (ECR, via OIDC) -> gitops-deploy (commit image tag; Argo CD syncs)
#
# PROJECT_DIR is "." when this project is its own repository. The copy at the
# monorepo root (.github/workflows/final-project.yml) sets it to the subfolder.
name: yatri-trips pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'helm/yatri-trips/values-prod.yaml'   # the deploy commit must not retrigger the pipeline
      - '**.md'
  pull_request:
  workflow_dispatch:

env:
  PROJECT_DIR: .
  IMAGE_NAME: yatri-trips
  AWS_REGION: ap-south-1

permissions:
  contents: write          # gitops-deploy commits the new image tag
  id-token: write          # OIDC to AWS - no long-lived keys
  security-events: write   # SARIF uploads to the Security tab

concurrency:
  group: yatri-pipeline-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-finished deploy

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}/application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run lint
      - run: npm test -- --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: junit, path: "${{ env.PROJECT_DIR }}/application/junit.xml" }

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: test
    container: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep - public rule packs + project rules
        run: |
          semgrep scan \
            --config p/javascript --config p/nodejs --config p/security-audit \
            --config ${PROJECT_DIR}/security/semgrep.yml \
            --error --severity ERROR \
            --sarif --output semgrep.sarif \
            ${PROJECT_DIR}/application/src
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: semgrep.sarif, category: semgrep }

  sca:
    name: SCA (dependencies + IaC misconfig)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: npm audit
        working-directory: ${{ env.PROJECT_DIR }}/application
        run: npm install --package-lock-only --no-audit --no-fund && npm audit --audit-level=high
      - name: Trivy - dependencies, secrets and misconfigurations (Dockerfile, Helm, Terraform)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (Trivy 0.70.0), pinned to a commit
        env:
          TRIVY_SKIP_CHECK_UPDATE: "true"   # use the checks embedded in the pinned scanner version
        with:
          scan-type: fs
          scan-ref: ${{ env.PROJECT_DIR }}
          trivy-config: ${{ env.PROJECT_DIR }}/security/trivy.yaml
          trivyignores: ${{ env.PROJECT_DIR }}/security/.trivyignore
          exit-code: '1'
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-fs.sarif, category: trivy-fs }

  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ env.PROJECT_DIR }}/security/gitleaks.toml

  build:
    name: Build image + scan + security gate
    runs-on: ubuntu-latest
    needs: [sast, sca, secret-scan]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=1.0.${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build (unit tests run again inside the build)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}/application
          file: ${{ env.PROJECT_DIR }}/docker/Dockerfile
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (Trivy 0.70.0), pinned to a commit
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: json
          output: trivy-image.json
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Security gate
        run: sh ${PROJECT_DIR}/security/security-gate.sh trivy-image.json 0 5
      - name: Save the scanned image
        run: docker save ${IMAGE_NAME}:${{ steps.meta.outputs.tag }} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: image, path: image.tar.gz, retention-days: 1 }

  push:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: build
    # Runs once the OIDC role from terraform/aws exists: set the repository
    # variable AWS_CI_ROLE_ARN to its ARN. Until then the job is skipped, not failed.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_CI_ROLE_ARN != ''
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with: { name: image }
      # Short-lived credentials from the OIDC role created in terraform/aws.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push the exact image that passed the gate
        run: |
          gunzip -c image.tar.gz | docker load
          REMOTE=${{ steps.ecr.outputs.registry }}/yatri/${IMAGE_NAME}:${{ needs.build.outputs.tag }}
          docker tag ${IMAGE_NAME}:${{ needs.build.outputs.tag }} "$REMOTE"
          docker push "$REMOTE"

  gitops-deploy:
    name: GitOps deploy (commit the new tag)
    runs-on: ubuntu-latest
    needs: [build, push]
    steps:
      - uses: actions/checkout@v4
      - name: Bump image.tag in values-prod.yaml
        run: |
          FILE=${PROJECT_DIR}/helm/yatri-trips/values-prod.yaml
          sed -i -E 's/^(  tag: ).*/\1"${{ needs.build.outputs.tag }}"/' "$FILE"
          git config user.name  "yatri-ci"
          git config user.email "ci@yatri.local"
          git commit -am "deploy: yatri-trips ${{ needs.build.outputs.tag }}"
          git push
      # No kubectl here: Argo CD sees the commit and rolls it out.
