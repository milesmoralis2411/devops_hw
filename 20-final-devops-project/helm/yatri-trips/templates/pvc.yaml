{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "yatri.fullname" . }}-data
  labels:
    {{- include "yatri.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep    # never delete user data on uninstall
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
