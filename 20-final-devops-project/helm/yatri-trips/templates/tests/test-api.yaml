apiVersion: v1
kind: Pod
metadata:
  name: {{ include "yatri.fullname" . }}-test
  labels:
    {{- include "yatri.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  # Must satisfy the "restricted" Pod Security Standard enforced on the namespace.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command:
        - /bin/sh
        - -c
        - |
          set -e
          wget -qO- http://{{ include "yatri.fullname" . }}:{{ .Values.service.port }}/healthz
          wget -qO- http://{{ include "yatri.fullname" . }}:{{ .Values.service.port }}/readyz
          wget -qO- http://{{ include "yatri.fullname" . }}:{{ .Values.service.port }}/api/trips
          echo "smoke test passed"
