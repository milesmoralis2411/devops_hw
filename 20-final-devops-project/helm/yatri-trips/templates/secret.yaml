{{- if .Values.secret.create }}
{{- if not .Values.secret.apiKey }}
{{- fail "secret.create=true requires secret.apiKey (pass it with --set, never commit it)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yatri.fullname" . }}-secret
  labels:
    {{- include "yatri.labels" . | nindent 4 }}
type: Opaque
data:
  API_KEY: {{ .Values.secret.apiKey | b64enc | quote }}
{{- end }}
