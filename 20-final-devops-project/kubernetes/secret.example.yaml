# EXAMPLE ONLY - not applied by kustomization.yaml and never filled in in Git.
# Create the real Secret out-of-band:
#   kubectl -n yatri create secret generic yatri-trips-secret --from-literal=API_KEY="$(openssl rand -hex 24)"
# (Terraform's cluster-bootstrap/ module does exactly this from a sensitive variable.)
apiVersion: v1
kind: Secret
metadata:
  name: yatri-trips-secret
  namespace: yatri
type: Opaque
stringData:
  API_KEY: REPLACE_ME
