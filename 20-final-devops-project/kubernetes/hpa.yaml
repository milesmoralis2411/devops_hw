# Rendered from helm/yatri-trips with values-prod.yaml:
#   helm template yatri-trips helm/yatri-trips -n yatri -f helm/yatri-trips/values-prod.yaml --skip-tests
# Plain manifests for kubectl/kustomize users. Edit the chart, then re-render.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: yatri-trips
  labels:
    helm.sh/chart: yatri-trips-1.0.0
    app.kubernetes.io/name: yatri-trips
    app.kubernetes.io/instance: yatri-trips
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: yatri
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: yatri-trips
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
