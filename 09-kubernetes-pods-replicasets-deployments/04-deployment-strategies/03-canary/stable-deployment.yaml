apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-demo-stable
  labels:
    app: canary-demo
    track: stable
spec:
  replicas: 4            # 4 stable + 1 canary = canary receives ~20% of traffic
  selector:
    matchLabels:
      app: canary-demo
      track: stable
  template:
    metadata:
      labels:
        app: canary-demo      # <- the Service selects on THIS label only
        track: stable
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          command: ["/bin/sh", "-c"]
          args:
            - echo "STABLE v1.0" > /usr/share/nginx/html/index.html && exec nginx -g "daemon off;"
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
