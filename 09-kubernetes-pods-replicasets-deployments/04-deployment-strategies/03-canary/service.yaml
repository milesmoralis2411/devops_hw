apiVersion: v1
kind: Service
metadata:
  name: canary-demo
spec:
  type: ClusterIP
  # Selects ONLY on app=canary-demo, deliberately ignoring the track label,
  # so Pods from BOTH Deployments become endpoints of this one Service.
  # Traffic split = canary replicas / total replicas = 1/5 = 20%.
  selector:
    app: canary-demo
  ports:
    - port: 80
      targetPort: 80
