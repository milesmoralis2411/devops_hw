apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-demo-canary
  labels:
    app: canary-demo
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-demo
      track: canary
  template:
    metadata:
      labels:
        app: canary-demo      # <- the Service selects on THIS label only
        track: canary
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          command: ["/bin/sh", "-c"]
          args:
            - echo "CANARY v2.0" > /usr/share/nginx/html/index.html && exec nginx -g "daemon off;"
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
