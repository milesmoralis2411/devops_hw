# PHASE: Succeeded
# Container runs to completion and exits 0. With restartPolicy: Never the
# Pod is NOT restarted, so it settles in the terminal phase Succeeded.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-succeeded
  labels: { demo: pod-lifecycle, phase: succeeded }
spec:
  restartPolicy: Never
  containers:
    - name: worker
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo 'doing work'; sleep 5; echo 'done'; exit 0"]
