# INIT PHASE
# Init containers run to completion, in order, BEFORE any app container
# starts. Watch the status go Init:0/2 -> Init:1/2 -> PodInitializing -> Running.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-init
  labels: { demo: pod-lifecycle, phase: init }
spec:
  initContainers:
    - name: init-wait
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo 'init 1: waiting for dependency'; sleep 15; echo 'init 1 done'"]
    - name: init-seed
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo '<h1>seeded by init container</h1>' > /work/index.html; echo 'init 2 done'"]
      volumeMounts:
        - name: html
          mountPath: /work
  containers:
    - name: app
      image: nginx:1.25-alpine
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      ports:
        - containerPort: 80
  volumes:
    - name: html
      emptyDir: {}
